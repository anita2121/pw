<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Dear Space</title>

<!-- ICON -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: transparent;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* BACKGROUND */
.bg-iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: -1;
    pointer-events: none;
}

/* LOGIN BOX */
.login-box {
    background: rgba(231, 195, 161, 0.9);
    backdrop-filter: blur(10px);
    padding: 25px 20px;
    width: 280px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    text-align: center;
}

/* LOGO */
.logo {
    width: 120px;
    margin-bottom: 10px;
}

/* TITLE */
h2 {
    color: #5a3e36;
    margin-bottom: 15px;
}

/* INPUT GROUP */
.input-group {
    position: relative;
    margin-bottom: 15px;
}

/* ICON */
.input-group i {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #a47551;
}

/* INPUT */
input {
    width: 100%;
    padding: 10px 10px 10px 35px; /* ruang buat icon */
    border-radius: 10px;
    border: none;
    background: #f8f3ef;
}

/* BUTTON */
.btn-group {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

button {
    width: 48%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

/* LOGIN */
.btn-login {
    background: #a47551;
    color: white;
}

.btn-login:hover {
    background: #8b5e3c;
}

/* CANCEL */
.btn-cancel {
    background: white;
    color: #5a3e36;
}

.btn-cancel:hover {
    background: #eee;
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<iframe src="../../CSS/CSS_4/Index2.html" class="bg-iframe"></iframe>

<!-- LOGIN -->
<div class="login-box">

    <!-- LOGO -->
    <img src="../../CSS/CSS_4/foto1.png" class="logo">

    <h2>Login</h2>

    <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="username" placeholder="Username">
    </div>

    <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" placeholder="Password">
    </div>

    <div class="btn-group">
        <button class="btn-login" onclick="login()">Login</button>
        <button class="btn-cancel" onclick="cancel()">Cancel</button>
    </div>

</div>

<script>
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if (user === "admin" && pass === "123") {
        alert("Login berhasil!");
    } else {
        alert("Username atau password salah!");
    }
}

function cancel() {
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
}
</script>

</body>
</html>
