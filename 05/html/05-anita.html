<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Dear Space</title>

<style>

/* RESET */
* {
    box-sizing: border-box;
}

/* BODY */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: transparent;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 🔥 BACKGROUND DARI INDEX2 */
.bg-iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;

    z-index: -1;
    pointer-events: none;
}

/* LOGIN BOX */
.login-box {
    background: rgba(231, 195, 161, 0.9);
    backdrop-filter: blur(10px);

    padding: 25px 20px;
    width: 280px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

/* TITLE */
h2 {
    text-align: center;
    color: #5a3e36;
    margin-bottom: 20px;
}

/* INPUT */
.input-group {
    margin-bottom: 15px;
}

label {
    font-size: 14px;
    color: #5a3e36;
}

input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    margin-top: 5px;
    background: #f8f3ef;
}

/* BUTTON */
.btn-group {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

button {
    width: 48%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

/* LOGIN */
.btn-login {
    background: #a47551;
    color: white;
}

.btn-login:hover {
    background: #8b5e3c;
}

/* CANCEL */
.btn-cancel {
    background: white;
    color: #5a3e36;
}

.btn-cancel:hover {
    background: #eee;
}

</style>
</head>

<body>

<!-- 🔥 BACKGROUND -->
<iframe src="../../CSS/CSS_4/Index2.html" class="bg-iframe"></iframe>

<!-- LOGIN -->
<div class="login-box">
    <h2>Login</h2>

    <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username">
    </div>

    <div class="input-group">
        <label>Sandi</label>
        <input type="password" id="password" placeholder="Masukkan sandi">
    </div>

    <div class="btn-group">
        <button class="btn-login" onclick="login()">Login</button>
        <button class="btn-cancel" onclick="cancel()">Cancel</button>
    </div>
</div>

<script>
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if (user === "admin" && pass === "123") {
        alert("Login berhasil!");
    } else {
        alert("Username atau sandi salah!");
    }
}

function cancel() {
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
}
</script>

</body>
</html>
