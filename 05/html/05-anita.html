<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Dear Space</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4efe9; /* cream */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card */
.login-box {
    background: #e6c2a6; /* coklat muda */
    padding: 30px;
    width: 320px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #5a3e36;
}

/* Input */
.input-group {
    margin-bottom: 15px;
}

label {
    color: #5a3e36;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    margin-top: 5px;
    background: #f8f3ef;
}

/* Tombol */
.btn-group {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

button {
    width: 48%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

/* Login */
.btn-login {
    background: #a47551;
    color: white;
}

.btn-login:hover {
    background: #8b5e3c;
}

/* Cancel */
.btn-cancel {
    background: #fff;
    color: #5a3e36;
}

.btn-cancel:hover {
    background: #eee;
}
</style>

</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username">
    </div>

    <div class="input-group">
        <label>Sandi</label>
        <input type="password" id="password" placeholder="Masukkan sandi">
    </div>

    <div class="btn-group">
        <button class="btn-login" onclick="login()">Login</button>
        <button class="btn-cancel" onclick="cancel()">Cancel</button>
    </div>
</div>

<script>
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if (user === "admin" && pass === "123") {
        alert("Login berhasil!");
    } else {
        alert("Username atau sandi salah!");
    }
}

function cancel() {
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
}
</script>

</body>
</html>
