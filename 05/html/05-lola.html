<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Estetik</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #f3e7e9, #e3eeff);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Card Login */
.login-box {
    width: 320px;
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255, 255, 255, 0.4);
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
}

.login-box h2 {
    margin-bottom: 20px;
    color: #444;
}

/* Input */
.input-group {
    margin-bottom: 15px;
    text-align: left;
}

.input-group label {
    font-size: 14px;
    color: #555;
}

.input-group input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: #f1f1f1;
    transition: 0.3s;
}

.input-group input:focus {
    background: #fff;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
}

/* Button */
.btn-group {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

button {
    width: 48%;
    padding: 10px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.login-btn {
    background: #a67c52;
    color: white;
}

.login-btn:hover {
    background: #8c6239;
}

.cancel-btn {
    background: #eee;
}

.cancel-btn:hover {
    background: #ddd;
}

</style>
</head>

<body>

<div class="login-box">
    <h2>Login</h2>

    <div class="input-group">
        <label>Username</label>
        <input type="text" placeholder="Masukkan username">
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="Masukkan sandi">
    </div>

    <div class="btn-group">
        <button class="login-btn">Login</button>
        <button class="cancel-btn">Cancel</button>
    </div>
</div>

</body>
</html>
