<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Floating Background</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    margin: 0;
}

/* FLOATING */
.floating {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.floating i {
    position: absolute;
    color: #c97f4f;
    opacity: 0.12;
    filter: blur(1px);
}

/* animasi */
@keyframes float1 {0%{transform:translateY(0);}50%{transform:translateY(-30px);}100%{transform:translateY(0);}}
@keyframes float2 {0%{transform:translateY(0);}50%{transform:translateY(-20px);}100%{transform:translateY(0);}}
@keyframes float3 {0%{transform:translateY(0);}50%{transform:translateY(-25px);}100%{transform:translateY(0);}}

/* posisi */
.floating i:nth-child(1){ top:5%; left:5%; font-size:60px; animation: float1 8s infinite;}
.floating i:nth-child(2){ top:20%; left:15%; font-size:50px; animation: float2 7s infinite;}
.floating i:nth-child(3){ top:40%; left:8%; font-size:65px; animation: float3 6s infinite;}
.floating i:nth-child(4){ top:70%; left:12%; font-size:55px; animation: float2 8s infinite;}
.floating i:nth-child(5){ top:10%; right:5%; font-size:70px; animation: float1 7s infinite;}
.floating i:nth-child(6){ top:35%; right:10%; font-size:50px; animation: float3 6s infinite;}
.floating i:nth-child(7){ bottom:15%; right:8%; font-size:60px; animation: float2 7s infinite;}
.floating i:nth-child(8){ bottom:5%; left:45%; font-size:55px; animation: float1 9s infinite;}
.floating i:nth-child(9){ top:60%; right:30%; font-size:45px; animation: float3 6s infinite;}
.floating i:nth-child(10){ bottom:30%; left:30%; font-size:40px; animation: float2 7s infinite;}
</style>
</head>

<body>

<div class="floating">
    <i class="fa-solid fa-house"></i>
    <i class="fa-solid fa-hammer"></i>
    <i class="fa-solid fa-screwdriver-wrench"></i>
    <i class="fa-solid fa-toolbox"></i>
    <i class="fa-solid fa-building"></i>
    <i class="fa-solid fa-paint-roller"></i>
    <i class="fa-solid fa-ruler-combined"></i>
    <i class="fa-solid fa-city"></i>
    <i class="fa-solid fa-house-chimney"></i>
    <i class="fa-solid fa-compass-drafting"></i>
</div>

</body>
</html>
