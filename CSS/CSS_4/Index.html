<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dear Space</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f1ec;
}

/* NAVBAR */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: white;
}

.logo-text {
    font-weight: 900;
    font-size: 26px;
    color: #c97f4f;
}

/* LOGO */
.logo {
    display: block;
    margin: 10px auto;
    width: 250px;
}

/* SECTION */
.section {
    text-align: center;
    padding: 40px 20px;
}

/* DESKRIPSI */
#deskripsi {
    max-width: 600px;
    margin: 10px auto 20px;
    font-size: 14px;
    color: #555;
}

/* BUTTON */
button {
    margin: 5px;
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

/* MAIN IMAGE */
#mainImage {
    width: 90%;
    max-width: 400px;
    border-radius: 15px;
    transition: 0.4s;
}

/* GALERI */
.gallery {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.gallery img {
    width: 80px;
    border-radius: 10px;
    cursor: pointer;
}

/* MODAL */
#imgModal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

#imgModal img {
    max-width: 80%;
    max-height: 80%;
}

.nav-btn {
    position: absolute;
    top: 50%;
    font-size: 30px;
    color: white;
    cursor: pointer;
}

#prev { left: 20px; }
#next { right: 20px; }

/* TOAST */
#toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #333;
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    opacity: 0;
    transition: 0.5s;
    z-index: 999;
}

#toast.show {
    opacity: 1;
}
</style>
</head>

<body>

<nav>
    <div class="logo-text">Dear Space</div>
</nav>

<img src="foto1.png" class="logo">

<div class="section">
    <h2>Contoh Konsep</h2>

    <p id="deskripsi">
        Konsep earth tone menghadirkan suasana hangat dengan warna alami.
    </p>

    <div>
        <button onclick="ubahKonsep('minimalis')">Minimalis</button>
        <button onclick="ubahKonsep('aesthetic')">Aesthetic</button>
        <button onclick="ubahKonsep('koreanstyle')">Korean Style</button>
        <button onclick="ubahKonsep('earthtone')">Earth Tone</button>
    </div>

    <br>

    <img id="mainImage" src="img/earthtone1.jpeg">

    <br><br>

    <div class="gallery" id="thumbnailContainer"></div>
</div>

<div class="footer">
    © 2026 Dear Space
</div>

<!-- MODAL -->
<div id="imgModal" onclick="closeImage()">
    <span id="prev" class="nav-btn" onclick="prevImage(event)">❮</span>
    <img id="imgPreview">
    <span id="next" class="nav-btn" onclick="nextImage(event)">❯</span>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
const basePath = "img/";

const dataKonsep = {
    minimalis: [
        basePath+"minimalis1.jpeg",
        basePath+"minimalis2.jpeg",
        basePath+"minimalis3.jpeg",
        basePath+"minimalis4.jpeg",
        basePath+"minimalis5.jpeg"
    ],
    aesthetic: [
        basePath+"aesthetic1.jpeg",
        basePath+"aesthetic2.jpeg",
        basePath+"aesthetic3.jpeg",
        basePath+"aesthetic4.jpeg",
        basePath+"aesthetic5.jpeg"
    ],
    koreanstyle: [
        basePath+"koreanstyle1.jpeg",
        basePath+"koreanstyle2.jpeg",
        basePath+"koreanstyle3.jpeg",
        basePath+"koreanstyle4.jpeg",
        basePath+"koreanstyle5.jpeg"
    ],
    earthtone: [
        basePath+"earthtone1.jpeg",
        basePath+"earthtone2.jpeg",
        basePath+"earthtone3.jpeg",
        basePath+"earthtone4.jpeg",
        basePath+"earthtone5.jpeg"
    ]
};

const deskripsiKonsep = {
    minimalis: "Konsep minimalis menampilkan ruangan yang sederhana dan rapi.",
    aesthetic: "Konsep aesthetic menghadirkan dekorasi yang unik dan estetik.",
    koreanstyle: "Konsep Korean Style menggunakan warna terang dan nuansa hangat.",
    earthtone: "Konsep earth tone menghadirkan suasana hangat dengan warna alami."
};

let currentImages = dataKonsep.earthtone;
let index = 0;

window.onload = () => loadImages(currentImages);

function ubahKonsep(nama) {
    currentImages = dataKonsep[nama];

    let img = document.getElementById("mainImage");
    img.style.opacity = 0;

    setTimeout(() => {
        img.src = currentImages[0];
        img.style.opacity = 1;
    }, 200);

    document.getElementById("deskripsi").innerText = deskripsiKonsep[nama];

    loadImages(currentImages);

    showToast("Menampilkan konsep " + nama);
}

function loadImages(images) {
    let container = document.getElementById("thumbnailContainer");
    container.innerHTML = "";

    images.forEach((img, i) => {
        let el = document.createElement("img");
        el.src = img;
        el.onclick = () => openImage(i);
        container.appendChild(el);
    });
}

function openImage(i) {
    index = i;
    document.getElementById("imgModal").style.display = "flex";
    document.getElementById("imgPreview").src = currentImages[index];
}

function closeImage() {
    document.getElementById("imgModal").style.display = "none";
}

function nextImage(e) {
    e.stopPropagation();
    index = (index + 1) % currentImages.length;
    document.getElementById("imgPreview").src = currentImages[index];
}

function prevImage(e) {
    e.stopPropagation();
    index = (index - 1 + currentImages.length) % currentImages.length;
    document.getElementById("imgPreview").src = currentImages[index];
}

function showToast(text) {
    let toast = document.getElementById("toast");
    toast.innerText = text;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2000);
}
</script>

</body>
</html>
