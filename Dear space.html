<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dear Space - Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --base-font: 16px;
    --ratio: 1.618;

    /* FONT */
    --font-sm: var(--base-font);
    --font-md: calc(var(--base-font) * var(--ratio));
    --font-lg: calc(var(--font-md) * var(--ratio));

    /* SPACING */
    --space-sm: 16px;
    --space-md: 26px;
    --space-lg: 42px;
    --space-xl: 68px;

    /* COLOR 60-30-10 */
    --bg-color: #f5f0eb;       /* 60% */
    --secondary-color: #e6c79c; /* 30% */
    --accent-color: #c68b59;    /* 10% */
    --text-color: #4a3f35;
}

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    line-height: var(--ratio);
}

    /* HERO (LOGO ATAS) */
.hero {
    text-align: center;
    margin-top: var(--space-lg);
    margin-bottom: var(--space-sm);
}

.logo img {
    width: 150px;
}

/* JUDUL */
.header {
    text-align: center;
    font-size: var(--font-lg);
    font-weight: 700;
    color: var(--accent-color);
    margin-bottom: var(--space-xl);
}

/* DESKRIPSI */
.desc-box {
    background: white;
    margin: auto;
    padding: var(--space-lg);
    width: 90%;
    max-width: 750px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    margin-bottom: var(--space-xl);
}

/* VISI MISI */
.visi-misi {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: var(--space-md);
    width: 90%;
    margin: auto;
    margin-bottom: var(--space-xl);
}

.card {
    background: linear-gradient(135deg, var(--secondary-color), #f0d4b2);
    padding: var(--space-md);
    border-radius: 20px;
    border-left: 6px solid var(--accent-color);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card h3 {
    text-align: center;
    font-size: var(--font-md);
    margin-bottom: var(--space-sm);
}

/* LAYANAN */
.section {
    text-align: center;
    margin-bottom: var(--space-xl);
}

.section h2 {
    font-size: var(--font-md);
    margin-bottom: var(--space-md);
}

.list-box {
    background: var(--accent-color);
    color: white;
    display: inline-block;
    padding: var(--space-md) var(--space-lg);
    border-radius: 20px;
    text-align: left;
    transition: 0.3s;
}

.list-box:hover {
    transform: scale(1.03);
}

.list-box ul {
    margin-bottom: var(--space-md);
}
