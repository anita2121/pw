```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Cute</title>

<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ffd6ec, #d6f0ff);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-box {
        background: white;
        padding: 30px;
        border-radius: 25px;
        width: 300px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .cute-img {
        width: 80px;
        margin-bottom: 10px;
    }

    h2 {
        color: #ff7eb9;
        margin-bottom: 20px;
    }

    .input-group {
        margin-bottom: 15px;
        text-align: left;
    }

    label {
        font-size: 13px;
        color: #888;
    }

    input {
        width: 100%;
        padding: 10px;
        border-radius: 15px;
        border: 1px solid #eee;
        outline: none;
        margin-top: 5px;
        background: #f9f9f9;
    }

    input:focus {
        border-color: #ff7eb9;
        background: #fff;
    }

    .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 20px;
        background: #ff7eb9;
        color: white;
        font-size: 14px;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s;
    }

    .btn:hover {
        background: #ff5fa2;
    }

    .cancel {
        background: #eee;
        color: #555;
    }

    .cancel:hover {
        background: #ddd;
    }

</style>
</head>

<body>

<div class="login-box">
    <!-- Gambar lucu -->
    <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" class="cute-img">

    <h2>Hello 💕</h2>

    <div class="input-group">
        <label>Username</label>
        <input type="text" placeholder="Masukkan username">
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="Masukkan password">
    </div>

    <button class="btn">Login 🌸</button>
    <button class="btn cancel">Cancel</button>
</div>

</body>
</html>
```
